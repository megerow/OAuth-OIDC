<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}MiniFlaskClient{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; color: #222; }
    table { border-collapse: collapse; width: 100%; margin: 10px 0 24px; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; vertical-align: top; }
    th { background: #f2f2f2; }
    code, pre { background: #f2f2f2; padding: 1px 4px; }
    pre { padding: 6px 10px; white-space: pre-wrap; word-break: break-all; margin: 0; }
    .button { display: inline-block; padding: 8px 16px; background: #0078d4; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; margin-right: 8px; }
    .button.secondary { background: #666; }
    .role { display: inline-block; background: #0078d4; color: white; border-radius: 10px; padding: 1px 10px; margin-right: 4px; }
    .ok { color: #107c10; font-weight: bold; }
    .denied { color: #a4262c; font-weight: bold; }
    .warn { color: #8a6d00; font-weight: bold; }
    .muted { color: #666; }
    .notice { background: #fff4ce; border: 1px solid #e8c84a; padding: 8px 12px; border-radius: 4px; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
